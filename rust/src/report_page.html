<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Screenshot Report</title>
<style>
:root{color-scheme:light;--bg:#f6f6f4;--surface-1:#fcfcfb;--text-primary:#0b0b0b;--text-secondary:#52514e;
--grid:#e4e3df;--axis:#bdbcb6;--series-1:#2a78d6;--series-2:#eb6834;--border:#e4e3df}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;--bg:#121211;
--surface-1:#1a1a19;--text-primary:#f0efec;--text-secondary:#c3c2b7;--grid:#2c2c2a;--axis:#4a4a46;
--series-1:#3987e5;--series-2:#d95926;--border:#2c2c2a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121211;--surface-1:#1a1a19;--text-primary:#f0efec;
--text-secondary:#c3c2b7;--grid:#2c2c2a;--axis:#4a4a46;--series-1:#3987e5;--series-2:#d95926;--border:#2c2c2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text-primary);
font:15px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:26px;margin:0 0 4px}h2{font-size:20px;margin:0 0 8px}h3{font-size:15px;margin:22px 0 6px}
section{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:20px;margin:18px 0}
.muted{color:var(--text-secondary)}
.tiles{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}
.tile{flex:1 1 140px;border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.big{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}
.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}
.tick,.lab,.val{fill:var(--text-secondary);font-size:11px}.lab{font-size:12px;fill:var(--text-primary)}
.s1{fill:var(--series-1)}.s2{fill:var(--series-2)}
.hit:hover .s1,.hit:hover .s2{opacity:.8}
.legend{display:flex;gap:16px;font-size:13px;color:var(--text-secondary)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
i.s1{background:var(--series-1)}i.s2{background:var(--series-2)}
.tablewrap{max-height:420px;overflow:auto;border:1px solid var(--border);border-radius:8px;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
th{position:sticky;top:0;background:var(--surface-1)}
a{color:var(--series-1)}details{margin-top:6px}summary{cursor:pointer;color:var(--text-secondary);font-size:13px}
.filter{font-size:13px;color:var(--text-secondary)}
#tip{position:fixed;pointer-events:none;background:var(--text-primary);color:var(--surface-1);padding:4px 8px;
border-radius:6px;font-size:12px;display:none;z-index:9}
</style></head><body><main>
<h1>Screenshot Report</h1>
<div class="muted">{{FOLDER}} · made {{WHEN}}</div>
{{SECTIONS}}
</main><div id="tip"></div>
<script>
const tip=document.getElementById('tip');
document.querySelectorAll('.hit').forEach(g=>{
 g.addEventListener('mousemove',e=>{tip.textContent=g.dataset.tip;tip.style.display='block';
  tip.style.left=Math.min(e.clientX+12,innerWidth-tip.offsetWidth-8)+'px';tip.style.top=(e.clientY+12)+'px'});
 g.addEventListener('mouseleave',()=>tip.style.display='none')});
const mine=document.getElementById('mineOnly');
if(mine)mine.addEventListener('change',()=>{document.querySelectorAll('table.ranks tbody tr').forEach(r=>{
 r.style.display=(mine.checked&&r.children[3].textContent!=='yes')?'none':''})});
</script></body></html>
