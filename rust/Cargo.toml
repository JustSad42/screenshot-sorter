[package]
name = "screenshot-sorter"
version = "2.1.0"
edition = "2021"
description = "Sorts screenshots into folders by what's in them"

[[bin]]
name = "screenshot-sorter"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
rayon = "1"
chrono = "0.4"
csv = "1"
filetime = "0.2"
trash = "5"
winreg = "0.55"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
rfd = "0.15"
notify-rust = "4"
notify = { version = "8", default-features = false }
tauri-plugin-single-instance = "2"
open = "5"
urlencoding = "2"
once_cell = "1"
ravif = { version = "0.13", default-features = false, features = ["threading"] }
windows = { version = "0.61", features = [
  "Media_Ocr", "Graphics_Imaging", "Storage", "Storage_Streams", "Globalization",
  "Foundation", "Foundation_Collections",
  "Win32_Foundation", "Win32_System_Threading", "Win32_System_Console", "Win32_System_WinRT", "Win32_Security",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
