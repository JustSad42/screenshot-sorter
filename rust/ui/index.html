      <div id="fl">${[...chosen.keys()].map(p => { const f = sug.find(x => x.path === p) || {loose: '?'};
        return `<label class="fchoice ${chosen.get(p)?'on':''}"><input type="checkbox" data-p="${esc(p)}" ${chosen.get(p)?'checked':''}><div class="tx"><b>${esc(baseName(p))}</b><small>${esc(p)}</small></div>
          <span class="badge">${f.loose === '?' ? 'chosen by you' : `${f.loose} loose picture${f.loose===1?'':'s'}`}</span></label>`; }).join('') || '<p class="muted">No usual screenshot folders found. Add yours below.</p>'}</div>
      <button class="btn" id="suAdd">${icon('plus')}Add another folder…</button>
      <div class="foot"><button class="btn" data-x>Not now</button><button class="btn primary" data-ok ${[...chosen.values()].some(Boolean)?'':'disabled'}>Next: preview</button></div>`;
    m.querySelectorAll('input[data-p]').forEach(i => i.onchange = () => { chosen.set(i.dataset.p, i.checked); draw(m, close); });
    $('#suAdd', m).onclick = async () => { const p = await api('pick_folder_path'); if (p) { chosen.set(p, true); draw(m, close); } };
    $('[data-x]', m).onclick = async () => { close(); const r = await api('save_settings', {setup_done: true}); S.settings = r.settings; toast('You can add folders any time', 'Settings → Auto-sort, or the folder button at the top.'); };
    $('[data-ok]', m).onclick = () => { close(); previewFolders([...chosen].filter(([, v]) => v).map(([p]) => p), {title: 'Here’s what would happen', step: 'Step 2 of 2', setup: true}); };
  };
  wideModal('', (m, close) => draw(m, close));
}
/** Show what watching these folders would do (counts per category), then let the user choose how to watch them. */
async function previewFolders(paths, {title, step = '', setup = false} = {}){
  let res;
  try { res = await job('preview_folders', {paths}, 'Reading screenshots to preview…'); } catch (e) { return; }
  const modes = new Map(paths.map(p => [p, 'instant']));
  wideModal(`${step ? `<div class="steps">${step}</div>` : ''}<h3>${esc(title)}</h3>
    <p>Nothing has moved yet. Choose how each folder is sorted; “Instantly” files the pictures below right away and every new screenshot from now on.</p>
    ${res.map((f, i) => `<div class="pv"><h4>${icon('folder')}${esc(baseName(f.path))}</h4><div class="muted" style="font-size:12.5px">${esc(f.path)}</div>
      <div style="margin-top:8px">${f.loose ? `<b>${f.moves.toLocaleString()}</b> of ${f.loose.toLocaleString()} loose picture${f.loose===1?'':'s'} would be filed` : 'No loose pictures right now; new screenshots will be filed as they arrive'}${f.sorted ? ` · ${f.sorted.toLocaleString()} already in category folders stay put` : ''}.</div>
      ${f.cats.length ? `<div class="cats">${f.cats.map(([c, n]) => `<span class="pill"><span class="dot" style="background:${color(c)}"></span>${esc(c)} ${n}</span>`).join('')}</div>` : ''}
      ${f.unsure ? `<div class="muted" style="font-size:12.5px">${f.unsure} would be close calls or unmatched; they'll wait for you on the Review page.</div>` : ''}
      ${f.skipped ? `<div class="muted" style="font-size:12.5px">${f.skipped} can't be read right now (for example online-only in OneDrive) and will be left alone.</div>` : ''}
      <div class="seg" data-i="${i}" style="margin-top:10px">${[['instant','Instantly'],['interval','Every few hours'],['off','Don’t sort it']].map(([k, l]) => `<button data-m="${k}" class="${k==='instant'?'on':''}">${l}</button>`).join('')}</div></div>`).join('')}
    <div class="foot"><button class="btn" data-x>${setup ? 'Not now' : 'Cancel'}</button><button class="btn primary" data-ok>Start</button></div>`, (m, close) => {
      m.querySelectorAll('.seg[data-i]').forEach(seg => seg.querySelectorAll('button').forEach(b => b.onclick = () => {
        seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); modes.set(res[+seg.dataset.i].path, b.dataset.m); }));
      $('[data-x]', m).onclick = async () => { close(); if (setup) { const r = await api('save_settings', {setup_done: true}); S.settings = r.settings; } };
      $('[data-ok]', m).onclick = async () => {
        close(); let r = null;
        for (const [p, mode] of modes) if (mode !== 'off') r = await api('set_folder_mode', p, mode);
        if (setup) r = await api('save_settings', {setup_done: true});
        if (r) { S.settings = r.settings; S.bg = r.background; renderBg(); }
        const n = [...modes.values()].filter(x => x !== 'off').length;
        toast(n ? `Watching ${n} folder${n===1?'':'s'}` : 'Nothing changed', n ? 'Follow along on the Activity page.' : '');
        if (S.view === 'settings') renderSettings(); if (n) go('activity');
      };
    });
}

/* ---------- search, keys, boot ---------- */
async function doSearch(q, album=null){
  if (!q) return;
  if (album) S.searchAll = true;  // albums always look in every folder
  const r = await job('search', {q, all: !!S.searchAll}, 'Searching…');
  S.searchFolders = r.folders || 1; S.mode = 'search'; S.lastQuery = q; S.items = r.items; S.filter = 'All'; S.sel.clear(); S.view = 'sort'; go('sort');
  S.album = album; renderSort(); renderAlbums();
}
async function setZoom(z){
  z = Math.round(Math.min(1.6, Math.max(0.6, z)) * 100) / 100;
  S.settings.ui_zoom = await api('set_zoom', z);
  toast(`Size ${Math.round(S.settings.ui_zoom * 100)}%`, '', {ms:1400});
  if (S.view === 'settings') renderSettings();
}
document.addEventListener('keydown', e => {
  if (e.ctrlKey && ['=','+','-','_','0'].includes(e.key)) { e.preventDefault();
    const z = S.settings.ui_zoom || 1; setZoom(e.key === '0' ? 1 : (e.key === '-' || e.key === '_') ? z - 0.1 : z + 0.1); return; }
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing) { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape') { if ($('#lightbox').classList.contains('on')) $('#lightbox').classList.remove('on');
    else if ($('#modal').classList.contains('on')) $('#modal').classList.remove('on'); else if (S.sel.size) { S.sel.clear(); refreshSel(); } else closeDrawer(); }
  if ($('#lightbox').classList.contains('on')) { if (e.key === 'ArrowLeft') openLightbox(S.lbIndex - 1); if (e.key === 'ArrowRight') openLightbox(S.lbIndex + 1); }
  if (e.ctrlKey && e.key.toLowerCase() === 'a' && !typing && (S.view === 'sort' || S.view === 'library')) { e.preventDefault(); visible().forEach(it => S.sel.add(it.p)); refreshSel(); }
});
$('#q').onkeydown = e => { if (e.key === 'Enter') doSearch(e.target.value.trim()); };
$('#themeBtn').onclick = async () => { const dark = document.documentElement.dataset.theme === 'dark';
  const r = await api('save_settings', {theme: dark ? 'light' : 'dark'}); S.settings = r.settings; applyTheme(); };
$('#folderBtn').onclick = e => { if (e.target.closest('#openFolder')) return api('open_folder');
  const r = $('#folderBtn').getBoundingClientRect(); folderMenu(r.left, r.bottom + 6); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

renderNav();
(async () => {
  const st = await api('init');
  Object.assign(S, {version: st.version, folder: st.folder, settings: st.settings, rules: st.rules, colors: st.rules.colors, bg: st.background});
  applyTheme(); renderFolder(); renderBg();
  if (!S.navigated) go('sort'); else { renderNav(); if (S.view === 'library') openLibrary(); }  // keep a screen picked while starting
  setInterval(async () => { S.bg = await api('background_status'); renderBg(); }, 8000);
  if (AUTO === 'preview') preview();
  loadAlbums(); refreshReviewCount(); setInterval(() => { refreshReviewCount(); loadAlbums(); }, 60000);
  if (!(S.settings.folders || []).length && !S.settings.setup_done && AUTO !== 'preview') openSetup();
  if (S.settings.check_updates !== false) setTimeout(async () => { try { S.upd = await api('check_update', false); renderUpd(); } catch {} }, 1500);
})();
</script>
</body>
