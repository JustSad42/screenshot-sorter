<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Screenshot Sorter</title>
<style>
:root{
  --bg:#f4f5f8;--panel:#ffffff;--panel-2:#f8f9fb;--sidebar:#eef0f5;--line:#e3e6ec;--line-2:#d5d9e2;
  --text:#14161c;--text-2:#545a68;--text-3:#8a90a0;--accent:#5b5bd6;--accent-2:#4848c4;--accent-soft:#ececfd;
  --good:#0ca30c;--danger:#d03b3b;--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
  --shadow-lg:0 12px 40px rgba(16,24,40,.18);--radius:12px;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f1115;--panel:#171a21;--panel-2:#1c2029;--sidebar:#12141a;--line:#262b36;--line-2:#323846;
  --text:#eceef3;--text-2:#a5abb9;--text-3:#727a8c;--accent:#7c7cf0;--accent-2:#9393f5;--accent-soft:#25264a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);--shadow-lg:0 16px 48px rgba(0,0,0,.5);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:232px 1fr;grid-template-rows:minmax(0,1fr);height:100vh;overflow:hidden}

/* sidebar */
.side{background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;min-height:0;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:650;font-size:15px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#6d6df2,#4f46e5);display:grid;place-items:center;
  box-shadow:0 4px 14px rgba(79,70,229,.35)}
.logo svg{width:17px;height:17px;stroke:#fff}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:9px 10px;border-radius:9px;cursor:pointer;
  color:var(--text-2);font-weight:500;text-align:left;transition:background .15s,color .15s}
.nav button:hover{background:var(--panel-2);color:var(--text)}
.nav button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.nav button.on svg{stroke:var(--accent)}
.nav .count{margin-left:auto;font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.side .spacer{flex:1}
.bgcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.bgcard .row{display:flex;align-items:center;gap:8px}
.bgcard .t{font-weight:600;font-size:13px}
.bgcard .s{font-size:12px;color:var(--text-3);margin-top:4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--text-3);flex:none}
.dot.live{background:var(--good);box-shadow:0 0 0 0 rgba(12,163,12,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(12,163,12,.45)}70%{box-shadow:0 0 0 7px rgba(12,163,12,0)}100%{box-shadow:0 0 0 0 rgba(12,163,12,0)}}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative}
.top{display:flex;align-items:center;gap:10px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--bg)}
.folder{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:7px 8px 7px 12px;min-width:0;max-width:44%;cursor:pointer;transition:border-color .15s}
.folder:hover{border-color:var(--line-2)}
.folder .path{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left;color:var(--text-2)}
.folder .path b{color:var(--text);font-weight:600}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 12px;
  transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{flex:1;border:0;background:none;outline:none;padding:9px 0}
.kbd{font-size:11px;color:var(--text-3);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;
  color:var(--text-2);transition:all .15s}
.iconbtn:hover{color:var(--text);border-color:var(--line-2)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;
  cursor:pointer;font-weight:550;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--line-2);transform:translateY(-1px)}
.btn:active{transform:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(91,91,214,.3)}
.updbar{display:none;align-items:center;gap:12px;margin:10px 22px 0;padding:10px 14px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent);font-size:13px}
.updbar.on{display:flex}.updbar .grow{flex:1}.updbar b{color:var(--accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn svg.i{width:16px;height:16px}
.progress{position:absolute;left:0;right:0;top:0;height:3px;overflow:hidden;opacity:0;transition:opacity .2s;z-index:20}
.progress.on{opacity:1}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#a78bfa);width:0;transition:width .25s}
.progress.indet i{width:35%;animation:indet 1.1s infinite ease-in-out}
@keyframes indet{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}

.view{flex:1 1 auto;min-height:0;overflow:auto;padding:20px 22px 90px;display:none;scrollbar-gutter:stable}
.view.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.vh{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.vh h1{font-size:22px;margin:0;font-weight:650;letter-spacing:-.01em}
.vh .sub{color:var(--text-3);font-size:13px;margin-top:2px}
.vh .actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:thin}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;
  cursor:pointer;white-space:nowrap;font-weight:500;color:var(--text-2);transition:all .15s}
.chip:hover{color:var(--text);border-color:var(--line-2)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip .n{font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}
.chip .sw{width:9px;height:9px;border-radius:3px}
.chip.drop{outline:2px dashed var(--accent);outline-offset:2px;transform:scale(1.05)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card,210px),1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;position:relative;
  transition:transform .15s,box-shadow .15s,border-color .15s;content-visibility:auto;contain-intrinsic-size:220px}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line-2)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.card .thumb{aspect-ratio:16/10;background:var(--panel-2);overflow:hidden;position:relative}
.card img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s,transform .3s}
.card img.ld{opacity:1}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
.card .thumb:not(.done){background:linear-gradient(90deg,var(--panel-2) 30%,var(--line) 50%,var(--panel-2) 70%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
.card .thumb .ph{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--text-3);font-size:12px;text-align:center;padding:10px}
.card .thumb .ph svg{width:26px;height:26px}
.card .thumb.bad .ph{display:flex}
.card .cloudtag{position:absolute;top:8px;right:8px;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:rgba(0,0,0,.55);color:#fff}
.card .cloudtag svg{width:15px;height:15px}
.card:hover img{transform:scale(1.03)}
.card .meta{padding:8px 10px 10px}
.card .name{font-size:12.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .why{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.card .tag{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;color:#fff;
  backdrop-filter:blur(6px);background:rgba(15,17,21,.62);display:flex;align-items:center;gap:6px}
.card .tag i{width:7px;height:7px;border-radius:50%}
.card .check{position:absolute;top:8px;left:8px;width:22px;height:22px;border-radius:7px;border:2px solid #fff;background:rgba(0,0,0,.25);
  opacity:0;transition:opacity .15s;display:grid;place-items:center}
.card:hover .check,.card.sel .check,.selecting .card .check{opacity:1}
.card.sel .check{background:var(--accent);border-color:var(--accent)}
.card.sel .check::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.card.ghost{opacity:.4}

/* empty */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px 20px;color:var(--text-3)}
.empty .art{width:74px;height:74px;border-radius:22px;background:var(--accent-soft);display:grid;place-items:center;margin-bottom:16px}
.empty .art svg{width:34px;height:34px;stroke:var(--accent)}
.empty h3{color:var(--text);margin:0 0 6px;font-size:17px}
.empty p{margin:0 0 18px;max-width:420px}

/* selection bar */
.selbar{position:absolute;left:50%;bottom:22px;transform:translate(-50%,140%);background:var(--text);color:var(--bg);border-radius:14px;
  padding:8px 8px 8px 16px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-lg);transition:transform .25s cubic-bezier(.2,.9,.3,1.2),visibility .25s;z-index:15;visibility:hidden}
.selbar.on{transform:translate(-50%,0);visibility:visible}
.selbar .btn{background:transparent;border-color:transparent;color:var(--bg)}
.selbar .btn:hover{background:rgba(127,127,127,.2)}
.selbar b{font-variant-numeric:tabular-nums}

/* menu */
.menu{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;min-width:230px;
  z-index:50;max-height:70vh;overflow:auto;animation:pop .12s ease}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--panel-2)}
.menu .sep{height:1px;background:var(--line);margin:5px 4px}
.menu .lbl{font-size:11px;color:var(--text-3);padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.06em}
.menu .sw{width:10px;height:10px;border-radius:3px;flex:none}

/* drawer */
.drawer{position:absolute;top:0;right:0;bottom:0;width:400px;background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);
  transform:translateX(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:12;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .hd{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .hd .ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.drawer .bd{overflow:auto;padding:16px;flex:1}
.drawer img{width:100%;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;background:var(--panel-2)}
.kv{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;margin:14px 0;font-size:13px}
.kv span:nth-child(odd){color:var(--text-3)}
.ocr{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--text-2);
  white-space:pre-wrap;max-height:240px;overflow:auto;user-select:text}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);margin:0 6px 6px 0}

/* lightbox */
.lightbox{position:fixed;inset:0;background:rgba(8,9,12,.88);backdrop-filter:blur(8px);display:none;z-index:60;align-items:center;justify-content:center}
.lightbox.on{display:flex;animation:fade .15s}
.lightbox img{max-width:92vw;max-height:86vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lightbox .cap{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#c9ccd6;font-size:13px}
.lightbox .nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.12);
  color:#fff;cursor:pointer;display:grid;place-items:center}
.lightbox .nav:hover{background:rgba(255,255,255,.22)}
.lightbox .prev{left:22px}.lightbox .next{right:22px}
.lightbox .x{position:absolute;top:18px;right:18px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,12,16,.45);backdrop-filter:blur(3px);display:none;z-index:70;align-items:center;justify-content:center}
.modal-bg.on{display:flex;animation:fade .15s}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);width:min(480px,92vw);padding:22px;animation:pop .15s}
.modal h3{margin:0 0 6px;font-size:17px}
.modal p{margin:0 0 14px;color:var(--text-2)}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.modal input[type=text],.modal input[type=password]{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px 12px;outline:none}
.modal input:focus{border-color:var(--accent)}
.toggle-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;margin:0 6px 8px 0;cursor:pointer;
  transition:all .15s;color:var(--text-2)}
.toggle-chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.toggle-chip.on::before{content:"✓";color:var(--accent);font-weight:700}

/* toasts */
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:11px 14px;min-width:260px;max-width:380px;
  display:flex;gap:10px;align-items:flex-start;animation:slidein .25s cubic-bezier(.2,.9,.3,1.2)}
.toast .ti{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700}
.toast.err .ti{background:#fde8e8;color:var(--danger)}
.toast .tb{flex:1}
.toast .tb small{display:block;color:var(--text-3)}
.toast .ta{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0 0 0 6px}
@keyframes slidein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.status{position:absolute;left:22px;right:22px;bottom:10px;font-size:12px;color:var(--text-3);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status:not(:empty){background:var(--bg);padding:4px 10px;border-radius:8px;border:1px solid var(--line);width:max-content;max-width:calc(100% - 44px)}

/* cards & forms */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.box h2{font-size:15px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.box h2 svg{stroke:var(--accent)}
.box .desc{color:var(--text-3);font-size:13px;margin:0 0 14px}
.setting{display:flex;align-items:center;gap:14px;padding:11px 0;border-top:1px solid var(--line)}
.setting:first-of-type{border-top:0}
.setting .lab{flex:1}
.setting .lab small{display:block;color:var(--text-3);font-size:12.5px}
.switch{position:relative;width:40px;height:23px;flex:none}
.switch input{display:none}
.switch span{position:absolute;inset:0;background:var(--line-2);border-radius:999px;transition:background .2s;cursor:pointer}
.switch span::after{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s cubic-bezier(.3,1.4,.5,1);
  box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(17px)}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--text-2);font-weight:550}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
input[type=range]{accent-color:var(--accent);width:160px}
.field{border:1px solid var(--line);background:var(--panel-2);border-radius:9px;padding:8px 11px;outline:none;min-width:0}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* categories editor */
.cat-wrap{display:grid;grid-template-columns:290px 1fr;gap:16px;align-items:start}
.cat-list{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--shadow)}
.cat-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;transition:background .15s}
.cat-item:hover{background:var(--panel-2)}
.cat-item.on{background:var(--accent-soft)}
.cat-item .sw{width:10px;height:10px;border-radius:3px;flex:none}
.cat-item .nm{flex:1;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-item .k{font-size:12px;color:var(--text-3)}
.cat-item.dragover{box-shadow:inset 0 2px 0 var(--accent)}
.kws{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.kw{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);overflow:hidden;font-size:13px}
.kw code{padding:5px 9px;font-family:"Cascadia Code",Consolas,monospace;font-size:12px;user-select:text}
.kw .w{border:0;border-left:1px solid var(--line);background:none;padding:5px 8px;cursor:pointer;font-weight:650;font-size:12px;min-width:34px}
.kw .w.w3{color:#fff;background:var(--accent)}
.kw .w.w2{color:var(--accent);background:var(--accent-soft)}
.kw .w.w05{color:var(--text-3)}
.kw .x{border:0;border-left:1px solid var(--line);background:none;padding:5px 8px;cursor:pointer;color:var(--text-3)}
.kw .x:hover{color:var(--danger)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stepper button{border:0;background:var(--panel-2);width:30px;height:32px;cursor:pointer;font-size:16px}
.stepper span{min-width:42px;text-align:center;font-weight:650;font-variant-numeric:tabular-nums}

/* insights */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.tile .big{font-size:28px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .lbl{color:var(--text-3);font-size:13px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:220px 1fr 50px;align-items:center;gap:10px;font-size:13px}
.bar .track{height:10px;background:var(--panel-2);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar .v{text-align:right;color:var(--text-2);font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:10px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.cols .c i{width:100%;max-width:46px;background:var(--accent);border-radius:6px 6px 2px 2px;transition:height .6s cubic-bezier(.2,.8,.2,1);position:relative}
.cols .c i:hover{filter:brightness(1.15)}
.cols .c small{font-size:11px;color:var(--text-3)}
.dupgroup{display:flex;gap:10px;overflow-x:auto;padding:10px 0;border-top:1px solid var(--line)}
.dupgroup .card{width:180px;flex:none}
.dupgroup .card .where{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.optrow{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:13px;margin:-2px 0 10px}
.samples{display:flex;gap:6px;margin:10px 0 2px;overflow:hidden}
.samples img{width:72px;height:46px;object-fit:cover;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);flex:none}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:12px;margin-top:12px}
.idea{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.idea .top{display:flex;align-items:center;gap:8px}
.idea .top input{flex:1;min-width:0;font-weight:600}
.idea .cnt{color:var(--text-3);font-size:12.5px;flex:none}
.idea .words{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.idea .words label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;background:var(--panel-2)}
.idea .words label.main{border-color:var(--accent);color:var(--accent)}
.idea .foot{display:flex;justify-content:flex-end;margin-top:10px}
.keep{position:absolute;top:8px;right:8px;font-size:11px;font-weight:650;background:var(--good);color:#fff;border-radius:999px;padding:2px 8px}
.extra{position:absolute;top:8px;right:8px;font-size:11px;font-weight:650;background:rgba(15,17,21,.65);color:#fff;border-radius:999px;padding:2px 8px}
.meter{height:10px;border-radius:999px;background:var(--panel-2);overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#1baf7a,#5b5bd6)}
/* activity */
.act-status{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:14px;margin-bottom:16px}
.act-status .box{padding:16px}
.job{margin-top:10px}
.job .jl{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:550}
.job .jl span:last-child{color:var(--text-3);font-variant-numeric:tabular-nums;font-weight:500;flex:none}
.job .jm{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.jbar{height:6px;border-radius:999px;background:var(--panel-2);overflow:hidden;margin-top:6px}
.jbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#a78bfa);transition:width .3s}
.jbar.indet i{width:30%;animation:indet 1.2s ease-in-out infinite}
.attn{border:1px solid rgba(217,145,0,.45);background:rgba(217,145,0,.08);border-radius:14px;padding:14px 16px;margin-bottom:16px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.attn>svg{width:22px;height:22px;stroke:#d99100;flex:none;margin-top:2px}
.attn .tx{flex:1 1 320px;min-width:0}
.attn .tx b{display:block;margin-bottom:2px}
.attn .tx p{margin:2px 0 0;color:var(--text-2);font-size:13px}
.attn .row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.bigstate{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:650;margin:4px 0 2px}
.bigstate .dot{width:10px;height:10px}
.muted{color:var(--text-3);font-size:13px}
.fold{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);min-width:0}
.fold:first-child{border-top:0}
.fold .p{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:550}
.badge{font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--text-2);white-space:nowrap;flex:none}
.badge.live{color:var(--good);border-color:rgba(12,163,12,.35)}
.badge.err{color:var(--danger);border-color:rgba(208,59,59,.35)}
.badge.you{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
.nums{display:flex;gap:18px;margin-top:6px}
.nums b{display:block;font-size:24px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.nums span{color:var(--text-3);font-size:12.5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters select,.filters input{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 10px;outline:none;max-width:100%}
.filters input{flex:1;min-width:160px}
.feed{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.day{font-size:11.5px;font-weight:650;color:var(--text-3);padding:9px 14px 7px;text-transform:uppercase;letter-spacing:.06em;background:var(--panel-2)}
.day:not(:first-child){border-top:1px solid var(--line)}
.ev{display:flex;align-items:center;gap:12px;padding:8px 14px;border-top:1px solid var(--line);min-width:0}
.day+.ev{border-top:0}
.ev .th{width:88px;height:55px;border-radius:7px;object-fit:cover;background:var(--panel-2);flex:none;cursor:zoom-in}
.ev .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--panel-2);flex:none;color:var(--text-3)}
.ev .ic.err{background:#fde8e8;color:var(--danger)}
.ev .bd{flex:1;min-width:0}
.ev .l1{display:flex;gap:8px;align-items:center;min-width:0}
.ev .nm{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ev .l2{font-size:12.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .l2 .sw{display:inline-block;width:8px;height:8px;border-radius:3px;margin:0 4px 0 2px}
.ev .tm{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums;flex:none}
.ev .acts{display:flex;gap:4px;opacity:.6;transition:opacity .15s;flex:none}
.ev:hover .acts{opacity:1}
.ev.info{padding:5px 14px;color:var(--text-3);font-size:12.5px}
.mini{padding:5px 9px;font-size:12.5px;border-radius:8px}
.more{display:block;margin:12px auto 0}
/* folder rows: name and path on top, mode picker underneath, so names never get cut short */
.fsetting{flex-wrap:wrap;row-gap:8px}
.fsetting .lab{min-width:0;flex:1 1 100%}
.fsetting .lab b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.fsetting .lab small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fsetting .seg{flex:1}
.fsetting .seg button{flex:1;padding:6px 10px}
/* very wide windows: keep text pages at a readable width instead of many thin columns */
#v-settings>*,#v-activity>*,#v-insights>*,#v-cleanup>*,#v-categories>*{max-width:1500px;margin-left:auto;margin-right:auto}
#v-settings .cards{grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr))}

/* smaller windows: icon sidebar, stacked panels, wrapping toolbars */
@media (max-width:1100px){
  .app{grid-template-columns:64px 1fr}
  .side{padding:14px 8px}
  .brand{justify-content:center;padding:4px 0 18px}
  .brand .bt,.nav button span,.nav .count{display:none}
  .nav button{justify-content:center;padding:10px}
  .bgcard{padding:12px 0;display:grid;place-items:center;cursor:pointer}
  .bgcard .t,.bgcard .s,.bgcard .btns{display:none}
  .bgcard .row{justify-content:center}
  .folder{max-width:40%}
}
@media (max-width:900px){
  .top{flex-wrap:wrap;padding:12px 16px}
  .folder{max-width:none;flex:1 1 100%;order:1}
  .search{order:2}
  #themeBtn{order:3}
  .view{padding:16px 16px 90px}
  .updbar{margin:10px 16px 0;flex-wrap:wrap}
  .cat-wrap{grid-template-columns:1fr}
  .bar{grid-template-columns:minmax(90px,140px) 1fr 44px}
  .drawer{width:min(400px,94%)}
  .fsetting{flex-wrap:wrap}
}
/* 2.2: chart series (validated: light + dark), review, timeline, albums, wizard */
:root{--s1:#2a78d6;--s2:#eb6834}
:root[data-theme="dark"]{--s1:#2a78d6;--s2:#dd5f2b}
.badge.warn{color:#b07400;border-color:rgba(217,145,0,.45);background:rgba(217,145,0,.08)}
.card .share{position:absolute;right:8px;bottom:8px;width:28px;height:28px;border-radius:8px;background:rgba(15,17,21,.62);color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .15s;cursor:grab}
.card .share svg{width:15px;height:15px}
.card:hover .share{opacity:1}
.nav .count.hot{background:var(--accent);color:#fff;border-radius:999px;padding:0 7px;font-weight:650}
.albums{margin-top:14px;display:flex;flex-direction:column;gap:2px}
.albums .ah{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;display:flex;align-items:center}
.albums .ah button{margin-left:auto;border:0;background:none;color:var(--text-3);cursor:pointer;padding:0 2px}
.albums .al{display:flex;align-items:center;gap:10px;border:0;background:none;padding:7px 10px;border-radius:9px;cursor:pointer;color:var(--text-2);text-align:left;font:inherit}
.albums .al:hover{background:var(--panel-2);color:var(--text)}
.albums .al.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.albums .al span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.albums .al small{color:var(--text-3);font-variant-numeric:tabular-nums}
/* review */
.rv{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.rv-list{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-height:calc(100vh - 230px);overflow:auto;padding:6px}
.rv-it{display:flex;gap:9px;align-items:center;padding:6px;border-radius:9px;cursor:pointer}
.rv-it:hover{background:var(--panel-2)}
.rv-it.on{background:var(--accent-soft)}
.rv-it img,.rv-it .ph2{width:64px;height:40px;border-radius:6px;object-fit:cover;background:var(--panel-2);flex:none}
.rv-it .tx{min-width:0;font-size:12px}
.rv-it .tx b{display:block;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-it .tx span{color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.rv-stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.rv-img{display:grid;place-items:center;background:var(--panel-2);border-radius:10px;min-height:240px;max-height:52vh;overflow:hidden}
.rv-img img{max-width:100%;max-height:52vh;display:block}
.rv-why{margin:12px 0 4px;color:var(--text-2);font-size:13px}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:12px}
.key{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px 11px;cursor:pointer;text-align:left;font:inherit;color:var(--text);transition:all .12s}
.key:hover{border-color:var(--accent);background:var(--accent-soft)}
.key kbd{font:600 11px/1 "Segoe UI",sans-serif;min-width:20px;height:20px;display:grid;place-items:center;border-radius:6px;background:var(--panel);border:1px solid var(--line);color:var(--text-2)}
.key .sw{width:9px;height:9px;border-radius:3px;flex:none}
.key span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key.ok{border-color:rgba(12,163,12,.45)}
.key.ai{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.rv-ai{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding:9px 12px;border-radius:10px;background:var(--accent-soft);font-size:13px}
.rv-ai .spin{width:13px;height:13px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:rvspin .8s linear infinite}
@keyframes rvspin{to{transform:rotate(360deg)}}
.rv-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;color:var(--text-3);font-size:12.5px}
/* timeline */
.tl{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:18px;align-items:start}
.tl-month{margin-bottom:22px}
.tl-month h3{font-size:16px;margin:0 0 8px;position:sticky;top:-20px;background:var(--bg);padding:8px 0;z-index:2}
.tl-day{font-size:12px;color:var(--text-3);font-weight:600;margin:12px 0 8px}
.tl-rail{position:sticky;top:0;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 220px);overflow:auto}
.tl-rail button{border:0;background:none;text-align:left;padding:5px 9px;border-radius:8px;cursor:pointer;color:var(--text-2);font:inherit;font-size:12.5px;display:flex;justify-content:space-between;gap:8px}
.tl-rail button:hover{background:var(--panel-2);color:var(--text)}
.tl-rail button small{color:var(--text-3);font-variant-numeric:tabular-nums}
/* activity batches */
.ev.grp{background:var(--panel-2)}
.ev.grp .ic{background:var(--accent-soft);color:var(--accent)}
.grp-body[hidden]{display:none}
.fixrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
/* charts */
.chartbox{margin-top:10px}
.cards.charts{grid-template-columns:1fr}
.chart2{width:100%;height:auto;display:block;overflow:visible}
.chart2 .grid{stroke:var(--line);stroke-width:1}
.chart2 .axis{stroke:var(--line-2);stroke-width:1}
.chart2 .tick{fill:var(--text-3);font-size:11px}
.chart2 .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart2 .pt{stroke:var(--panel);stroke-width:2}
.chart2 .hit{fill:transparent;cursor:default}
.chart2 .hit:hover+.pt,.chart2 g.hov .pt{r:6}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--text-2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ctip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-lg);border-radius:9px;padding:6px 9px;font-size:12.5px;z-index:90;display:none;max-width:280px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.tbl th{text-align:left;color:var(--text-3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl tr:hover td{background:var(--panel-2)}
.tabs{margin-left:auto}
.seg button svg{width:15px;height:15px;margin-right:6px;vertical-align:-3px}
/* setup / preview dialog */
.modal.wide{width:min(700px,94vw);max-height:88vh;overflow:auto}
.fchoice{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;cursor:pointer}
.fchoice.on{border-color:var(--accent);background:var(--accent-soft)}
.fchoice input{accent-color:var(--accent);width:16px;height:16px}
.fchoice .tx{flex:1;min-width:0}
.fchoice .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fchoice .tx small{color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pv{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.pv h4{margin:0 0 4px;font-size:14px;display:flex;align-items:center;gap:8px}
.pv .cats{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.steps{font-size:12px;color:var(--text-3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
@media (max-width:900px){.rv{grid-template-columns:1fr}.rv-list{max-height:220px}.tl{grid-template-columns:1fr}.tl-rail{display:none}}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:999px;border:3px solid transparent;background-clip:content-box}
</style>
</head>

<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M8 12h8M8 15h5"/></svg></div><span class="bt">Screenshot Sorter</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="albums" id="albums"></div>
    <div class="spacer"></div>
    <div class="bgcard" id="bgcard"></div>
  </aside>
  <main class="main">
    <div class="progress" id="progress"><i></i></div>
    <header class="top">
      <div class="folder" id="folderBtn" title="Switch folder">
        <svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span class="path" id="folderPath"></span>
        <button class="btn" style="padding:5px 10px" id="openFolder" title="Open in File Explorer"><svg class="i" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
      </div>
      <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" placeholder="Search the text inside every screenshot…"><span class="kbd">/</span></label>
      <button class="iconbtn" id="themeBtn" title="Switch theme"></button>
    </header>

    <div class="updbar" id="updbar"></div>
    <section class="view" id="v-sort"></section>
    <section class="view" id="v-review"></section>

</div>
<div class="lightbox" id="lightbox"></div>
<div class="modal-bg" id="modal"></div>
<div class="toasts" id="toasts"></div>

<script>
const AUTO = window.__AUTO;  // set by the app when opened from the Explorer menu
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

}, true);
const ICONS = {

  categories:'<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',

/* ---------- plumbing ---------- */
function toast(msg, sub='', opts={}){
  const el = document.createElement('div'); el.className = 'toast' + (opts.err ? ' err' : '');
  el.innerHTML = `<div class="ti">${opts.err ? '!' : '✓'}</div><div class="tb">${esc(msg)}${sub ? `<small>${esc(sub)}</small>` : ''}</div>` +
    (opts.action ? `<button class="ta">${esc(opts.action)}</button>` : '');
  if (opts.action) el.querySelector('.ta').onclick = () => { opts.onAction(); el.remove(); };
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), opts.ms || 5000);
}
function setStatus(t){ $('#status').textContent = t || ''; }
function progress(on, d=0, t=0){
  const p = $('#progress'); p.classList.toggle('on', on);
  p.classList.toggle('indet', on && !t); $('i', p).style.width = t ? (100 * d / t) + '%' : '';
}
async function job(kind, args={}, label='Working…'){
  if (S.busy) { toast('Still busy with the last task', '', {err:true}); throw new Error('busy'); }
  S.busy = true; document.querySelectorAll('[data-busy]').forEach(b => b.disabled = true);
  progress(true); setStatus(label);
  try {
    const id = await api('start_job', kind, args);
    while (true) {
      await new Promise(r => setTimeout(r, 180));
      const j = await api('job', id);
      if (!j) continue;
      const [d, t] = j.progress; progress(true, d, t);
      setStatus(t ? `${j.message && !j.message.startsWith('Reading') ? j.message : label} ${d}/${t}` : (j.message || label));
      if (j.done) {
        if (j.error) throw new Error(j.error);
        return j.has_result ? j.result : null;
      }
    }
  } catch (e) { if (e.message !== 'busy') toast('Something went wrong', e.message, {err:true}); throw e; }
  finally { S.busy = false; progress(false); setStatus(''); document.querySelectorAll('[data-busy]').forEach(b => b.disabled = false); }
}
function modal(html, setup){
  const m = $('#modal'); m.innerHTML = `<div class="modal">${html}</div>`; m.classList.add('on');
  const close = () => m.classList.remove('on');
  m.onclick = e => { if (e.target === m) close(); };
  setup && setup($('.modal', m), close); return close;
}
function confirmBox(title, text, okLabel='Continue', danger=false){
  return new Promise(res => modal(`<h3>${esc(title)}</h3><p>${esc(text)}</p><div class="foot"><button class="btn" data-x>Cancel</button>
    <button class="btn ${danger?'danger':'primary'}" data-ok>${esc(okLabel)}</button></div>`, (m, close) => {
      $('[data-x]', m).onclick = () => { close(); res(false); }; $('[data-ok]', m).onclick = () => { close(); res(true); }; }));
}
function prompt2(title, text, value=''){
  return new Promise(res => modal(`<h3>${esc(title)}</h3><p>${esc(text)}</p><input type="text" value="${esc(value)}">
    <div class="foot"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>OK</button></div>`, (m, close) => {
      const i = $('input', m); setTimeout(() => { i.focus(); i.select(); }, 30);
      const ok = () => { close(); res(i.value.trim() || null); };
      i.onkeydown = e => { if (e.key === 'Enter') ok(); if (e.key === 'Escape') { close(); res(null); } };
      $('[data-x]', m).onclick = () => { close(); res(null); }; $('[data-ok]', m).onclick = ok; }));
}

/* ---------- shell ---------- */
function renderNav(){
  $('#nav').innerHTML = NAV.map(([k, l]) => `<button data-v="${k}" title="${l}" class="${S.view===k?'on':''}">${icon(k)}<span>${l}</span>
    ${k==='sort' && S.mode==='plan' && S.items.length ? `<span class="count">${S.items.length}</span>` : ''}${k==='review' && S.reviewCount ? `<span class="count hot">${S.reviewCount}</span>` : ''}</button>`).join('');

function go(v){

      ? `<button class="btn primary mini" id="bgSet">Set up</button>`

      <button class="btn mini" id="bgAct">Activity</button></div>`;

  on('bgPause', async () => { S.bg = await api('pause'); renderBg(); toast('Auto-sort paused', 'Nothing moves until you resume.'); if (S.view === 'activity') refreshActivity(true); });
  on('bgAct', () => go('activity'));
}

const baseName = p => String(p || '').replace(/[\\/]+$/, '').split(/[\\/]/).pop();
function switchFolder(f, quiet){
  S.folder = f; renderFolder(); S.items = []; S.dups = []; S.mode = 'plan'; S.sel.clear();

      : `<div class="muted" style="padding:4px 10px 8px">None yet</div>`) +
    `<div class="sep"></div><button data-add>${icon('plus')}Watch another folder…</button><button data-other>${icon('open')}Open a folder without watching it…</button><button data-manage>${icon('settings')}Manage folders</button>`;

  $('[data-add]', m).onclick = async () => { closeMenu(); await addFolder(); };
  $('[data-other]', m).onclick = async () => { closeMenu(); const f = await api('pick_folder'); if (f) switchFolder(f); };
  $('[data-manage]', m).onclick = () => { closeMenu(); go('settings'); };
  setTimeout(() => document.addEventListener('mousedown', outside), 0);
}

/* ---------- activity ---------- */
S.act = []; S.actShow = 250; S.af = {folder:'', kind:'all', cat:'', q:''};
const hhmm = t => (t || '').slice(11, 16);
function dayLabel(t){
  const d = (t || '').slice(0, 10), now = new Date(), iso = x => new Date(x.getTime() - x.getTimezoneOffset()*60000).toISOString().slice(0, 10);
  if (d === iso(now)) return 'Today';
  if (d === iso(new Date(now - 864e5))) return 'Yesterday';
  return new Date(d + 'T12:00').toLocaleDateString(undefined, {weekday:'long', day:'numeric', month:'long'});
}
function relTime(sec){
  const d = sec - Date.now()/1000;
  if (Math.abs(d) < 90) return d >= 0 ? 'in a minute' : 'just now';
  const m = Math.round(Math.abs(d) / 60), h = Math.round(Math.abs(d) / 3600);
  const t = m < 60 ? `${m} min` : `${h} h`;
  return d >= 0 ? `in ${t}` : `${t} ago`;
}
async function openActivity(){
  const el = $('#v-activity');

    <div id="actAttn"></div><div class="act-status" id="actStatus"></div><div class="filters" id="actFilters"></div><div id="actFeed"><div class="empty"><p>Loading…</p></div></div>`;
  $('#actSort').onclick = async () => { const b = $('#actSort'); b.disabled = true; b.innerHTML = `${icon('clock')}Sorting…`;
    try { const n = await api('sort_all_now'); toast(n ? `Sorted ${n} screenshot${n===1?'':'s'}` : 'Nothing new to sort'); } finally { b.disabled = false; b.innerHTML = `${icon('play')}Sort all folders now`; refreshActivity(true); } };
  $('#actAdd').onclick = addFolder;

async function refreshActivity(force){
  if (S.view !== 'activity') return;
  const r = await api('activity', 1500);
  S.bg = r.status; S.jobs = r.jobs || []; S.unread = r.unread || []; S.undone = r.undone || []; renderBg();
  const sig = r.entries.length + '|' + (r.entries[0] ? JSON.stringify(r.entries[0]) : '');

const JOB_LABEL = {preview:'Previewing new screenshots', sort:'Sorting', browse:'Loading the library', search:'Searching', fetch_cloud:'Downloading & sorting OneDrive files',
  rename:'Giving files readable names', dups:'Looking for duplicates', recycle:'Moving to the Recycle Bin', shrink:'Shrinking pictures', report:'Making the report', insights:'Counting', undo:'Undoing'};
function jobHtml(label, msg, d, t){
  const pct = t ? Math.min(100, 100 * d / t) : 0;
  return `<div class="job"><div class="jl"><span>${esc(label)}</span><span>${t ? `${d.toLocaleString()} / ${t.toLocaleString()}` : ''}</span></div>
    ${msg ? `<div class="jm" title="${esc(msg)}">${esc(msg)}</div>` : ''}<div class="jbar ${t ? '' : 'indet'}"><i style="${t ? `width:${pct}%` : ''}"></i></div></div>`;
}
function renderAttn(){
  const host = $('#actAttn'); if (!host) return;
  const un = (S.unread || []).filter(u => u.count > 0);
  const fetching = (S.jobs || []).some(j => j.kind === 'fetch_cloud');
  // problems in the last day, one card per kind of problem, with the fix
  const dayAgo = new Date(Date.now() - 864e5 - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 19);
  const probs = {}; (S.act || []).filter(e => e.kind === 'error' && (e.t || '') >= dayAgo).forEach(e => { const f = fixFor(e.msg), k = f.tip || e.msg; (probs[k] = probs[k] || {f, e, n: 0}).n++; });
  const probHtml = Object.values(probs).slice(0, 3).map(({f, e, n}) => `<div class="attn">${icon('alert')}<div class="tx"><b>${esc(f.tip || e.msg)}</b>
      <p>${n > 1 ? `${n} problems like this in the last day. Latest: ` : ''}${esc(e.msg)}</p><div class="row">${fixButtons(e.msg)}</div></div></div>`).join('');
  if (!un.length) { host.innerHTML = probHtml; host.querySelectorAll('[data-fix]').forEach(b => b.onclick = () => runFix(b.dataset.fix)); return; }
  host.innerHTML = probHtml + un.map(u => `<div class="attn">${icon('cloud')}<div class="tx">
      <b>${u.count.toLocaleString()} picture${u.count===1?'':'s'} in ${esc(baseName(u.folder))} ${u.count===1?'hasn’t':'haven’t'} been read yet</b>
      <p>${u.cloud ? `${u.cloud === u.count ? 'They are' : `${u.cloud.toLocaleString()} are`} online-only in OneDrive, so they aren't on this PC and can't be read until they're downloaded. ` : ''}Until then they stay loose or in “No Text”, and search can't find them.</p>
      <div class="row"><button class="btn primary mini" data-fetch="${esc(u.folder)}" ${fetching || S.busy ? 'disabled' : ''}>${icon('download')}${fetching ? 'Working on it…' : 'Download & sort them'}</button>
      <span class="muted" style="font-size:12px">Downloads them from OneDrive (they'll take up space on this PC), reads them two at a time and files each one.</span></div></div></div>`).join('');
  host.querySelectorAll('[data-fix]').forEach(b => b.onclick = () => runFix(b.dataset.fix));
  host.querySelectorAll('[data-fetch]').forEach(b => b.onclick = async () => {
    b.disabled = true; b.innerHTML = `${icon('download')}Working on it…`;
    refreshActivity(true);
    try { const r = await job('fetch_cloud', {folder: b.dataset.fetch}, 'Downloading & sorting OneDrive files…');

    catch (e) { if (String(e) !== 'Error: busy') toast("Couldn't finish", String(e), {err:true}); }
    finally { refreshActivity(true); }
  });
}
function renderActStatus(){

  const auto = td.filter(e => e.kind === 'move' && e.by === 'auto').length, you = td.filter(e => (e.kind === 'move' || e.kind === 'rename') && e.by === 'you').length, errs = td.filter(e => e.kind === 'error').length;
  const state = !n ? 'Off' : b.paused ? 'Paused' : b.busy ? 'Working' : 'Running';
  const fs = b.folders || [];
  $('#actStatus').innerHTML = `
    <div class="box"><h2>${icon('bolt')}Right now</h2>
      <div class="bigstate"><span class="dot ${b.running?'live':''}"></span>${(S.jobs||[]).length && state !== 'Paused' ? 'Working' : state}</div>

/** What a problem means in plain words, and buttons that fix it. */
function fixFor(msg){
  const m = String(msg || '').toLowerCase();
  if (m.includes('cloud file provider') || m.includes('cloud operation')) return {tip: 'OneDrive isn’t running, so pictures that are online-only can’t be opened.', acts: [['onedrive', 'Start OneDrive'], ['retry', 'Try again']]};
  if (m.includes('access is denied') || m.includes('being used by another process') || m.includes('os error 32') || m.includes('os error 5')) return {tip: 'Another program has the file open (or Windows blocked it). Close it, then try again.', acts: [['retry', 'Try again']]};
  if (m.includes("can't watch")) return {tip: 'This folder can’t be watched. It may have been moved, renamed or deleted.', acts: [['settings', 'Folder settings']]};
  if (m.includes("couldn't read")) return {tip: 'Windows couldn’t open these pictures. If they’re in OneDrive, make sure OneDrive is running.', acts: [['onedrive', 'Start OneDrive'], ['retry', 'Try again']]};
  if (m.includes("couldn't move")) return {tip: 'The file couldn’t be moved. It may be open in another program, or the folder may be read-only.', acts: [['retry', 'Try again']]};
  return {tip: '', acts: [['retry', 'Try again']]};
}
async function runFix(kind){
  try {
    if (kind === 'onedrive') { await api('start_onedrive'); toast('Starting OneDrive', 'Give it a minute to sign in, then press Try again.'); }
    else if (kind === 'retry') { const n = await api('sort_all_now'); toast(n ? `Sorted ${n} screenshot${n===1?'':'s'}` : 'Nothing new to sort'); refreshActivity(true); }
    else if (kind === 'settings') go('settings');
  } catch (e) { toast("That didn't work", String(e), {err:true}); }
}
function fixButtons(msg){ return fixFor(msg).acts.map(([k, l]) => `<button class="btn mini" data-fix="${k}">${esc(l)}</button>`).join(''); }
function evHtml(e, i, batchUndone=false){
  const tm = `<span class="tm">${hhmm(e.t)}</span>`;
  if (e.kind === 'info') return `<div class="ev info">${icon('clock')}<span style="flex:1">${esc(e.msg)}</span>${tm}</div>`;

    <button class="btn" id="sbClear">${icon('x')}</button>`;
  $('#sbMove').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); moveMenu(r.left, r.top - 8, true); };
  $('#sbOpen').onclick = () => [...S.sel].slice(0, 8).forEach(p => api('open', p));

}
function moveMenu(x, y, above=false){
  closeMenu();
  const names = [...(S.rules?.data.categories || []).map(c => c.name), S.rules?.data.fallback || 'Other', S.rules?.data.no_text || 'No Text'];
  const m = document.createElement('div'); m.className = 'menu'; m.id = 'menu';
  m.innerHTML = `<div class="lbl">Move ${S.sel.size} to</div>` + names.map(n => `<button data-c="${esc(n)}"><span class="sw" style="background:${color(n)}"></span>${esc(n)}</button>`).join('') +
    `<div class="sep"></div><button data-new>${icon('plus')}New category…</button>` +
    (S.sel.size === 1 ? `<div class="sep"></div><button data-open>${icon('open')}Open</button><button data-reveal>${icon('library')}Show in folder</button>` : '');
  document.body.appendChild(m);
  const r = m.getBoundingClientRect();
  m.style.left = Math.min(x, innerWidth - r.width - 10) + 'px';
  m.style.top = (above ? Math.max(10, y - r.height) : Math.min(y, innerHeight - r.height - 10)) + 'px';
  m.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { closeMenu(); moveSelection(b.dataset.c); });
  $('[data-new]', m).onclick = async () => { closeMenu(); const n = await prompt2('New category', 'Name for the new category:'); if (n) moveSelection(n); };
  const one = [...S.sel][0];
  $('[data-open]', m) && ($('[data-open]', m).onclick = () => { closeMenu(); api('open', one); });
  $('[data-reveal]', m) && ($('[data-reveal]', m).onclick = () => { closeMenu(); api('reveal', one); });
  setTimeout(() => document.addEventListener('mousedown', outside), 0);
}
function outside(e){ if (!e.target.closest('#menu')) closeMenu(); }
function closeMenu(){ $('#menu')?.remove(); document.removeEventListener('mousedown', outside); }

async function moveSelection(cat){
  const paths = [...S.sel].filter(p => S.items.find(it => it.p === p && it.c !== cat));
  if (!paths.length) return;
  const from = new Set(paths.map(p => S.items.find(it => it.p === p).c));
  if (S.mode === 'plan') {
    S.items.forEach(it => { if (paths.includes(it.p)) { it.c = cat; it.r = 'You chose this'; it.conf = ''; } });
    toast(`${paths.length} will go to ${cat}`, 'Applied when you press Sort now');
  } else {
    const moved = await api('move', paths, cat);
    S.items.forEach(it => { if (moved[it.p]) { it.p = moved[it.p]; it.n = it.p.split('\\').pop(); it.c = cat; it.r = 'You moved this'; } });
    toast(`Moved ${Object.keys(moved).length} to ${cat}`, '', {action:'Undo', onAction: undo});
  }
  S.sel.clear(); if (S.filter !== 'All' && from.has(S.filter) && !S.items.some(it => it.c === S.filter)) S.filter = 'All';
  renderNav(); renderChips(); renderGrid(); teach(cat, paths.map(p => S.items.find(it => it.c === cat && (it.p === p || it.p.endsWith(p.split('\\').pop()))))?.filter(Boolean).map(it => it.p));
}
async function teach(cat, paths){
  if (!paths?.length) return;
  const words = await api('suggest', paths, cat);
  if (!words.length) return;
  modal(`<h3>${icon('sparkle')} Teach it</h3><p>Tick words that mean a screenshot belongs in <b>${esc(cat)}</b>. Similar screenshots will go there automatically next time.</p>
    <div id="tw">${words.map(w => `<span class="toggle-chip" data-w="${esc(w)}">${esc(w)}</span>`).join('')}</div>
    <div class="foot"><button class="btn" data-x>Skip</button><button class="btn primary" data-ok>Add keywords</button></div>`, (m, close) => {
      m.querySelectorAll('.toggle-chip').forEach(c => c.onclick = () => c.classList.toggle('on'));
      $('[data-x]', m).onclick = close;
      $('[data-ok]', m).onclick = async () => { const ws = [...m.querySelectorAll('.toggle-chip.on')].map(c => c.dataset.w);
        close(); if (ws.length) { S.rules = await api('add_keywords', cat, ws); S.colors = S.rules.colors; toast(`Added ${ws.length} keyword${ws.length>1?'s':''} to ${cat}`); } };
    });
}

async function preview(){
  const r = await job('preview', {}, 'Reading new screenshots…');
  S.mode = 'plan'; S.items = r.items; S.filter = 'All'; S.sel.clear(); go('sort');
  if (!r.items.length) toast('No new screenshots', 'Everything in this folder is already sorted.');
}
async function sortNow(){
  const plan = S.mode === 'plan' && S.items.length ? S.items.map(it => ({p: it.p, c: it.c, r: it.r, conf: it.conf})) : null;
  const r = await job('sort', {plan}, 'Sorting…');
  S.items = []; S.sel.clear(); S.mode = 'plan'; renderNav(); renderSort();
  toast(r.moved ? `Sorted ${r.moved} screenshot${r.moved>1?'s':''}` : 'Nothing to sort', r.moved ? 'Saved into category folders.' : 'No new screenshots in this folder.',
        r.moved ? {action:'Undo', onAction: undo} : {});
}
async function undo(){
  const r = await job('undo', {}, 'Undoing…');
  toast(r.had ? `Moved ${r.moved} file${r.moved===1?'':'s'} back` : 'Nothing to undo');
  if (S.view === 'library') openLibrary(); else { S.items = []; renderNav(); renderSort(); }
}

/* library */
async function openLibrary(){
  const el = $('#v-library');
  el.innerHTML = `<div class="vh"><div><h1>Library</h1><div class="sub">${S.libAll ? 'Everything in every folder' : 'Everything in this folder'}, by category. Right-click or drag to re-file.</div></div>
    <div class="actions">
      ${(S.settings.folders || []).length ? `<div class="seg" id="libScope"><button data-a="" class="${S.libAll?'':'on'}">This folder</button><button data-a="1" class="${S.libAll?'on':''}">All folders</button></div>` : ''}
      <div class="seg" id="libView"><button data-v="grid" class="${S.libView!=='timeline'?'on':''}">${icon('library')}Grid</button><button data-v="timeline" class="${S.libView==='timeline'?'on':''}">${icon('calendar')}Timeline</button></div>
      <input type="range" min="150" max="360" value="${S.cardSize}" id="sizeL">
    <button class="btn" data-busy id="renB">${icon('rename')}Readable names…</button>
    <button class="btn" data-busy id="undoL">${icon('undo')}Undo</button></div></div>
    <div class="chips" id="chips"></div><div id="gridHost"><div class="empty"><div class="art">${icon('library')}</div><h3>Loading…</h3></div></div>`;
  $('#sizeL').oninput = e => { S.cardSize = +e.target.value; document.documentElement.style.setProperty('--card', S.cardSize + 'px'); };
  $('#undoL').onclick = undo;
  el.querySelectorAll('#libScope button').forEach(b => b.onclick = () => { S.libAll = !!b.dataset.a; S.filter = 'All'; openLibrary(); });
  el.querySelectorAll('#libView button').forEach(b => b.onclick = () => { S.libView = b.dataset.v; el.querySelectorAll('#libView button').forEach(x => x.classList.toggle('on', x === b)); S.sel.clear(); renderGrid(); });
  $('#renB').onclick = async () => {
    if (!await confirmBox('Readable file names', 'Rename every sorted screenshot to something like “2026-10-13 234220 Chat - Alex.png”? Undo puts the old names back.', 'Rename')) return;
    const r = await job('rename', {}, 'Renaming…'); toast(`Renamed ${r.moved} files`, '', {action:'Undo', onAction: undo}); openLibrary();
  };
  const show = items => {
    S.mode = 'browse'; S.items = items;
    if (S.filter !== 'All' && !S.items.some(i => i.c === S.filter)) S.filter = 'All';
    renderChips(); renderGrid();
  };
  // 1) show the remembered Library straight away
  let shown = '';
  try {
    const snap = await api('library_snapshot', !!S.libAll);
    if (snap.items?.length && S.view === 'library') { S.sel.clear(); show(snap.items); shown = snap.items.map(i => i.p + i.c).join('|'); }
  } catch (e) {}
  // 2) quietly check for changes, and only redraw if something changed
  try {
    const r = await job('browse', {all: !!S.libAll}, shown ? 'Checking for changes…' : 'Loading library…');
    if (S.view !== 'library') return;
    if (r.items.map(i => i.p + i.c).join('|') !== shown) { if (!shown) S.sel.clear(); show(r.items); }
  } catch (e) {}
}

function openLightbox(i){
  const list = visible(); if (i < 0 || !list.length) return;

  lb.innerHTML = `<img src="${img(it.p, 0)}"><div class="cap">${esc(it.n)} · ${esc(it.c)} · ${S.lbIndex + 1} / ${list.length}</div>

/* ---------- categories ---------- */
function kwParts(k){ return typeof k === 'object' ? [k.k, k.w ?? 1] : [k, 1]; }
function renderCategories(){
  const data = S.rules.data; const el = $('#v-categories');
  if (!S.editCat || !data.categories.find(c => c.name === S.editCat)) S.editCat = data.categories[0]?.name;
  const c = data.categories.find(x => x.name === S.editCat);
  el.innerHTML = `<div class="vh"><div><h1>Categories</h1><div class="sub">A screenshot goes to the category whose keywords add up to the most points. Drag to reorder - higher wins ties.</div></div>
    <div class="actions"><button class="btn primary" id="catAdd">${icon('plus')}New category</button></div></div>
    <div class="box" style="margin-bottom:16px"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">${icon('idea')}Ideas from Other</h2>
      <button class="btn" data-busy id="ideaFind" style="margin-left:auto">${icon('search')}${S.ideas ? 'Look again' : 'Find ideas'}</button></div>
      <p class="desc" style="margin-bottom:0">Words that show up in many “Other” screenshots but rarely in sorted ones. Make one a category and the matching screenshots move there.</p>
      <div id="ideaHost">${S.ideas ? ideasHtml() : ''}</div></div>
    <div class="cat-wrap"><div class="cat-list" id="catList">${data.categories.map((x, i) => `
      <div class="cat-item ${x.name===S.editCat?'on':''}" draggable="true" data-i="${i}"><span class="sw" style="background:${color(x.name)}"></span>
      <span class="nm">${esc(x.name)}</span><span class="k">${x.keywords.length}</span></div>`).join('')}</div>
    ${c ? `<div class="box"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <h2 style="margin:0;font-size:18px"><span class="sw" style="width:12px;height:12px;border-radius:4px;display:inline-block;background:${color(c.name)}"></span>${esc(c.name)}</h2>
        <div style="margin-left:auto;display:flex;gap:8px"><button class="btn" id="catRen">${icon('rename')}Rename</button><button class="btn danger" id="catDel">${icon('cleanup')}Delete</button></div></div>
      <div class="setting" style="border:0;padding-top:16px"><div class="lab">Minimum score<small>Points needed before this category can win. Higher = stricter.</small></div>
        <div class="stepper"><button id="msDown">−</button><span id="ms">${c.min_score ?? c.min_matches ?? 1}</span><button id="msUp">+</button></div></div>
      <div style="font-weight:600;margin-top:10px">Keywords <span style="color:var(--text-3);font-weight:400;font-size:12.5px">· click a weight to change it (½ weak → 3 strong)</span></div>
      <div class="kws">${c.keywords.map((k, i) => { const [p, w] = kwParts(k); const cls = w >= 3 ? 'w3' : w >= 2 ? 'w2' : w < 1 ? 'w05' : '';
        return `<span class="kw" title="${esc(p)}"><code>${esc(p.replace(/\\b/g, '').replace(/\\([^\w\s])/g, '$1'))}</code><button class="w ${cls}" data-i="${i}" title="${esc(p)}">${w < 1 ? '½' : w}</button><button class="x" data-i="${i}">${icon('x','i" style="width:13px;height:13px')}</button></span>`; }).join('') || '<span style="color:var(--text-3)">No keywords yet.</span>'}</div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:6px"><input class="field" id="kwNew" placeholder="Add a word or phrase…" style="flex:1">
        <label style="display:flex;align-items:center;gap:6px;color:var(--text-2);font-size:13px"><input type="checkbox" id="kwRegex"> regular expression</label>
        <div class="seg" id="kwW"><button data-w="0.5">½</button><button data-w="1" class="on">1</button><button data-w="2">2</button><button data-w="3">3</button></div>
        <button class="btn primary" id="kwAdd">Add</button></div></div>` : ''}</div>`;
  const save = async () => { try { S.rules = await api('save_rules', data); S.colors = S.rules.colors; renderCategories(); } catch (e) { toast('Could not save', e.message, {err:true}); } };
  el.querySelectorAll('.cat-item').forEach(it => {
    it.onclick = () => { S.editCat = data.categories[+it.dataset.i].name; renderCategories(); };
    it.ondragstart = e => e.dataTransfer.setData('text/plain', it.dataset.i);
    it.ondragover = e => { e.preventDefault(); it.classList.add('dragover'); };
    it.ondragleave = () => it.classList.remove('dragover');
    it.ondrop = e => { e.preventDefault(); const from = +e.dataTransfer.getData('text/plain'), to = +it.dataset.i;
      if (isNaN(from) || from === to) return; const [m] = data.categories.splice(from, 1); data.categories.splice(to, 0, m); save(); };
  });
  $('#ideaFind').onclick = async () => { const r = await job('ideas', {}, 'Looking through Other…'); S.ideas = r; renderCategories();
    if (!r.ideas.length) toast('No clear ideas', r.other < 20 ? 'There are only a few screenshots in Other.' : 'Nothing stands out in Other right now.'); };
  el.querySelectorAll('[data-mk]').forEach(b => b.onclick = async () => {
    const card = b.closest('.idea'), name = $('input[type=text]', card).value.trim();
    const words = [...card.querySelectorAll('.words input:checked')].map(x => x.value);
    if (!name || !words.length) return toast('Give it a name and keep at least one word', '', {err:true});
    try { const r = await job('make_category', {name, words}, `Making “${name}”…`);
      S.rules = r.rules; S.colors = r.rules.colors; S.editCat = name; S.ideas.ideas = S.ideas.ideas.filter(x => x.word !== card.dataset.w); renderCategories();
      toast(`Made “${name}”`, r.moved ? `Moved ${r.moved} screenshot${r.moved===1?'':'s'} from Other. Undo all from Activity.` : 'No screenshots in Other matched yet.'); }
    catch (e) { if (String(e) !== 'Error: busy') toast("Couldn't make it", String(e), {err:true}); }
  });
  $('#catAdd').onclick = async () => { const n = await prompt2('New category', 'Name for the new category:'); if (!n) return;
    data.categories.push({name: n, min_score: 2, keywords: []}); S.editCat = n; save(); };
  if (!c) return;
  $('#catRen').onclick = async () => { const n = await prompt2('Rename category', 'New name (existing folders keep their name):', c.name); if (n && n !== c.name) { c.name = n; S.editCat = n; save(); } };
  $('#catDel').onclick = async () => { if (await confirmBox('Delete category', `Delete “${c.name}”? Files already in its folder are not touched.`, 'Delete', true)) { data.categories.splice(data.categories.indexOf(c), 1); S.editCat = null; save(); } };
  const setMs = d => { c.min_score = Math.max(0.5, (c.min_score ?? c.min_matches ?? 1) + d); delete c.min_matches; save(); };
  $('#msDown').onclick = () => setMs(-0.5); $('#msUp').onclick = () => setMs(0.5);
  const W = [0.5, 1, 2, 3];
  el.querySelectorAll('.kw .w').forEach(b => b.onclick = () => { const i = +b.dataset.i; const [p, w] = kwParts(c.keywords[i]);
    const nw = W[(W.indexOf(w) + 1) % W.length] ?? 1; c.keywords[i] = nw === 1 ? p : {k: p, w: nw}; save(); });
  el.querySelectorAll('.kw .x').forEach(b => b.onclick = () => { c.keywords.splice(+b.dataset.i, 1); save(); });
  let w = 1; el.querySelectorAll('#kwW button').forEach(b => b.onclick = () => { w = +b.dataset.w; el.querySelectorAll('#kwW button').forEach(x => x.classList.toggle('on', x === b)); });
  const add = () => { const v = $('#kwNew').value.trim(); if (!v) return;
    const p = $('#kwRegex').checked ? v : '\\b' + v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b';
    try { new RegExp(p); } catch (e) { toast('That pattern is not valid', e.message, {err:true}); return; }
    c.keywords.push(w === 1 ? p : {k: p, w}); save(); };
  $('#kwAdd').onclick = add; $('#kwNew').onkeydown = e => { if (e.key === 'Enter') add(); };
}

    const r = await job('recycle', {paths: extra}, 'Recycling…'); S.dups = []; renderCleanup(); toast(`Sent ${r.removed} files to the Recycle Bin`); };
  S.fmt = S.fmt || 'avif';
  const FMT = {
    avif: {name: 'AVIF', what: 'PNG and WebP', ratio: 0.15,
      desc: 'Converts PNG and WebP screenshots to AVIF (quality 80). Usually 80-90% smaller and looks the same, text included - but it is not pixel-for-pixel identical. Originals are kept in a backup folder next to the app until you delete them.'},
    webp: {name: 'WebP', what: 'PNG', ratio: 0.6,

  };

  const f = FMT[S.fmt];

  $('#shrinkB').innerHTML = `${icon('zip')}Convert to ${f.name}…`;

  $('#shrinkB').disabled = !est.count;
  $('#bkHost').innerHTML = est.backup_count ? `Backup of originals: <b>${est.backup_count.toLocaleString()}</b> files · <b>${mb(est.backup_size)} MB</b>
    <div style="display:flex;gap:8px;margin-top:8px"><button class="btn" id="bkOpen">${icon('open')}Open backup folder</button>
    <button class="btn danger" id="bkDel">${icon('cleanup')}Delete backup…</button></div>` : '';

    $('#bkOpen').onclick = () => api('open_originals');

      if (!await confirmBox('Delete backup of originals', `Permanently delete ${est.backup_count} original files (${mb(est.backup_size)} MB)? This can't be undone - only do it once you're happy with the converted screenshots.`, 'Delete permanently', true)) return;

  $('#shrinkB').onclick = async () => {

      : `Convert ${est.count} PNGs (${mb(est.size)} MB) to lossless WebP? Pictures stay identical; originals go to the Recycle Bin.`;

}

/* ---------- local AI (Ollama) ---------- */
async function loadLocalModels(el){
  const r = await api('local_models').catch(e => ({ok: false, error: String(e)}));
  const sel = $('#lmSel', el), stat = $('#lmStat', el); if (!sel) return;
  if (!r.ok || !r.models.length) {
    S.localModels = [];
    stat.textContent = r.ok ? 'Ollama is running but has no chat models. Install one, e.g. “ollama pull gemma3”.' : r.error;
    sel.disabled = true; return;
  }
  S.localModels = r.models;
  const cur = S.settings.local_model;
  sel.disabled = false;
  sel.innerHTML = r.models.map(m => `<option value="${esc(m.name)}" ${m.name === cur ? 'selected' : ''}>${esc(m.name)}${m.vision ? ' · sees images' : ' · text only'}${m.gb ? ` · ${m.gb} GB` : ''}</option>`).join('')
    + (cur && !r.models.some(m => m.name === cur) ? `<option selected value="${esc(cur)}">${esc(cur)} (not installed)</option>` : '');
  stat.textContent = `Ollama is running · ${r.models.length} model${r.models.length === 1 ? '' : 's'}`;
  sel.onchange = async () => { const x = await api('save_settings', {local_model: sel.value}); S.settings = x.settings; toast(`Local model: ${sel.value}`); };
}
S.rvAI = {};
/** Review page: ask the local model about the screenshot on screen (once per picture). */
async function rvAsk(it){
  const box = $('#rvAi'); if (!box) return;
  const show = a => {
    if (!$('#rvAi') || rvList()[S.rvIdx]?.p !== it.p) return;  // moved on meanwhile
    document.querySelectorAll('#rvHost .key.ai').forEach(k => k.classList.remove('ai'));
    if (a.err) { $('#rvAi').innerHTML = `${icon('robot')}<span class="muted">Local AI: ${esc(a.err)}</span><button class="btn mini" id="rvAiRetry">Try again</button>`;
      $('#rvAiRetry').onclick = () => { delete S.rvAI[it.p]; rvAsk(it); }; return; }
    const key = [...document.querySelectorAll('#rvHost .key[data-c]')].find(k => k.dataset.c === a.c); key?.classList.add('ai');
    $('#rvAi').innerHTML = `${icon('robot')}<span>Local AI suggests <span class="pill"><span class="dot" style="background:${color(a.c)}"></span>${esc(a.c)}</span>${a.why ? ` · <span class="muted">${esc(a.why)}</span>` : ''}</span>
      ${a.c === it.c ? '<span class="muted">(where it already is)</span>' : `<button class="btn mini primary" id="rvAiUse"><kbd>A</kbd> Use it</button>`}`;
    $('#rvAiUse') && ($('#rvAiUse').onclick = () => rvFile(a.c));
  };
  if (S.rvAI[it.p]) return show(S.rvAI[it.p]);
  box.innerHTML = `<span class="spin"></span><span>Local AI is looking at this one…</span>`;
  try { const r = await api('local_suggest', it.p); S.rvAI[it.p] = r; }
  catch (e) { S.rvAI[it.p] = {err: String(e)}; }
  show(S.rvAI[it.p]);
}

async function rvFile(cat){

    try { const words = (await api('suggest', [to], cat)).slice(0, 2);
      if (words.length) { S.rules = await api('add_keywords', cat, words, 1); S.colors = S.rules.colors; learned = words; } } catch (e) {}

/* ---------- charts (one axis each, thin marks, hover tips) ---------- */
function tipOn(host){
  const tip = $('#ctip');
  host.querySelectorAll('[data-tip]').forEach(el => {
    el.onmouseenter = () => { tip.innerHTML = el.dataset.tip; tip.style.display = 'block'; el.parentNode.classList?.add('hov'); };
    el.onmousemove = e => { tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (e.clientY - tip.offsetHeight - 10) + 'px'; };
    el.onmouseleave = () => { tip.style.display = 'none'; el.parentNode.classList?.remove('hov'); };
  });
}
function chartW(){ const h = $('#insHost'); return Math.max(340, Math.round((h ? h.clientWidth : 760) - 40)); }
/** Tick positions (0..1) that land on round numbers: 0 1 2 3 4 5, 0 5 10 15 20... */
function tickFracs(span){
  const nice = x => { const m = 10 ** Math.floor(Math.log10(x)), k = +(x / m).toFixed(6); return [1, 2, 2.5, 5].includes(k); };
  for (const n of [5, 4, 6, 3]) if (span > 0 && nice(span / n)) return [...Array(n + 1).keys()].map(i => i / n);
  return [0, .25, .5, .75, 1];
}
function niceMax(v){ if (v <= 5) return 5; const m = 10 ** Math.floor(Math.log10(v)); for (const k of [1, 2, 2.5, 5, 10]) if (v <= k * m) return k * m; return v; }
const fmtN = v => v >= 1e6 ? (v / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : v >= 1e4 ? Math.round(v / 1e3) + 'K' : v >= 1e3 ? (v / 1e3).toFixed(1).replace(/\.0$/, '') + 'K' : String(Math.round(v * 10) / 10);
/** points: [{x: 'YYYY-MM-DD HH:MM', y, tip}] — one series, time along the bottom. */
function lineChart(points, {yMin = null, yMax = null, yTicks = null, color = 'var(--s1)'} = {}){
  const W = chartW(), H = 230, L = 64, R = 14, T = 12, B = 26;
  const xs = points.map(p => new Date(p.x.replace(' ', 'T')).getTime());
  const x0 = Math.min(...xs), x1 = Math.max(...xs) === x0 ? x0 + 864e5 : Math.max(...xs);
  const lo = yMin ?? Math.min(0, ...points.map(p => p.y)), hi = yMax ?? niceMax(Math.max(...points.map(p => p.y)) || 1);
  const X = t => L + (W - L - R) * (t - x0) / (x1 - x0), Y = v => T + (H - T - B) * (1 - (v - lo) / ((hi - lo) || 1));
  const ticks = yTicks || tickFracs(hi - lo).map(f => ({v: lo + (hi - lo) * f, l: fmtN(lo + (hi - lo) * f)}));
  let svg = `<svg class="chart2" viewBox="0 0 ${W} ${H}" role="img">`;
  ticks.forEach(t => { const y = Y(t.v); svg += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="tick" x="${L - 6}" y="${y + 4}" text-anchor="end">${esc(t.l)}</text>`; });
  const fmtD = t => new Date(t).toLocaleDateString(undefined, {day:'numeric', month:'short', year: (x1 - x0) > 300 * 864e5 ? '2-digit' : undefined});
  [x0, (x0 + x1) / 2, x1].forEach((t, i) => svg += `<text class="tick" x="${X(t)}" y="${H - 6}" text-anchor="${['start', 'middle', 'end'][i]}">${fmtD(t)}</text>`);
  svg += `<line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>`;
  if (points.length > 1) svg += `<path class="ln" stroke="${color}" d="${points.map((p, i) => `${i ? 'L' : 'M'}${X(xs[i]).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ')}"/>`;
  points.forEach((p, i) => svg += `<g><circle class="hit" cx="${X(xs[i])}" cy="${Y(p.y)}" r="11" data-tip="${esc(p.tip)}"/><circle class="pt" cx="${X(xs[i])}" cy="${Y(p.y)}" r="4" fill="${color}"/></g>`);
  return svg + '</svg>';
}
/** groups: [{label, values:[a,b]}], two series side by side, 2px gap, rounded tops. */
function columnChart(groups, names, colors){
  const W = chartW(), H = 230, L = 44, R = 10, T = 12, B = 26;
  const hi = niceMax(Math.max(1, ...groups.flatMap(g => g.values)));
  const gw = (W - L - R) / Math.max(groups.length, 1), k = names.length, bw = Math.min(22, (gw * 0.72 - 2 * (k - 1)) / k);
  const Y = v => T + (H - T - B) * (1 - v / hi);
  let svg = `<svg class="chart2" viewBox="0 0 ${W} ${H}" role="img">`;
  tickFracs(hi).forEach(f => { const y = Y(hi * f); svg += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="tick" x="${L - 6}" y="${y + 4}" text-anchor="end">${fmtN(hi * f)}</text>`; });
  groups.forEach((g, gi) => {
    const gx = L + gi * gw + (gw - (bw * k + 2 * (k - 1))) / 2;
    g.values.forEach((v, si) => { const x = gx + si * (bw + 2), y = Y(v), h = H - B - y, r = Math.min(4, bw / 2, h);
      if (h > 0) svg += `<path fill="${colors[si]}" d="M${x},${H - B} V${y + r} Q${x},${y} ${x + r},${y} H${x + bw - r} Q${x + bw},${y} ${x + bw},${y + r} V${H - B} Z"/>`;
      svg += `<rect class="hit" x="${x - 1}" y="${T}" width="${bw + 2}" height="${H - T - B}" data-tip="${esc(g.label)} · ${esc(names[si])}: ${v}"/>`; });
    if (groups.length <= 14 || gi % Math.ceil(groups.length / 14) === 0) svg += `<text class="tick" x="${gx + bw * k / 2}" y="${H - 6}" text-anchor="middle">${esc(g.label)}</text>`;
  });
  return svg + `<line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/></svg>`;
}
const legend = (names, colors) => `<div class="legend">${names.map((n, i) => `<span><i style="background:${colors[i]}"></i>${esc(n)}</span>`).join('')}</div>`;
const shortD = d => new Date(d.replace(' ', 'T')).toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'});
